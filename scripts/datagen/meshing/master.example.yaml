# A master config. Copy it anywhere, edit it, and run:
#     python -m scripts.datagen.meshing.master <your copy>.yaml
#
# One section per stage; they always run in the order below, whatever order you write them in. Each needs
# `enabled: true` or `enabled: false` (machine_check is on when its section is left out). A section's other keys
# are its stage script's options, `-` written as `_`: `python -m scripts.datagen.<folder>.<script> --help` lists
# them (the scripts named beside each section below).
#
# Paths: relative ones are under data/. `shared` names a committed store; write one only on purpose. The run's
# folder (`folder:` below) holds its log, log.log, a copy of this file, config_<time>.yaml, and every output left
# out, under <stage>/. A stage reads what an earlier stage of this run wrote unless you name something else.
#
# YAML: quote names YAML would read as something else (yes, no, on, off, 0012); write 1e-3 as 1.0e-3; indent with
# spaces; in double quotes a backslash starts an escape, so write Windows paths with / or in single quotes.

# folder: experiments/dx003          the run's folder; left out: a new data/scratchpad/<time>_<this file's name>/.
#                                    Named again, it keeps one log (each run under its own PLAN) and resumes a campaign

# settings:                          values of src/datagen/constants.py for this run, named in lower case; each stage
#   gate_skew_max: 0.22              takes those it reads. A stage's own `settings:` sets them for it alone, over these.
#   rung2_budget: 60                 The campaign and the re-mesh must agree: the re-mesh finds the campaign's meshes
#                                    by their settings. Left out, every value is the constant's

machine_check:                       # does this machine sample and mesh like the reference? ~1 min
  enabled: true                      # false: a warning, and this run does not check

geometry_calibrate:                  # the CST order/nose/tolerance table (scripts/datagen/geometry/calibrate.py)
  enabled: false
  folder: D:/airfoils/for_cst        # reads: the .dat files
  orders: 4-12
  # out: experiments/cst/orders.txt  writes: the report

geometry_ingest:                     # .dat folder -> geometry manifest (scripts/datagen/geometry/ingest.py)
  enabled: false
  folder: D:/airfoils/for_cst        # leave out to only bring stored airfoils to the current shape version
  dry_run: false
  # data_root: shared                writes; shared = the committed manifest (one person at a time)

mesh_calibrate:                      # the ladder's numbers on real meshes (scripts/datagen/meshing/calibrate.py)
  enabled: false
  rungs: [1, 2, 3]
  workers: 6
  # airfoils: [s1223, e376]          left out: each rung's own
  # out: experiments/dx003/calibration
  # settings:                        for this stage alone, e.g. a stricter gate to see what rung 2 would take
  #   gate_skew_max: 0.22

campaign:                            # every airfoil's best mesh (scripts/datagen/meshing/campaign.py)
  enabled: true
  workers: 6
  settings_label: trial 3, finer DX_MAX     # names the settings row, if this campaign records it first
  db: experiments/dx003/meshing.sqlite      # writes; name it to resume a stopped campaign (shared = committed)
  # airfoils: [naca0012, s1223]      left out: every accepted shape
  # geometry_db: shared              reads; default: this run's ingest, else shared

remesh:                              # best runs' meshes back out, hash-checked (scripts/datagen/meshing/remesh.py)
  enabled: true
  airfoils: [naca0012, s1223]        # or  all: true    or  run: <run id>
  vtk: true
  out: experiments/dx003/remeshed    # writes
  # db: shared                       reads; default: this run's campaign, else shared
