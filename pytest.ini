[pytest]
testpaths = tests
pythonpath = .

# The interactive viewer blocks on a human, so it is out of every run unless asked for by
# `-m interactive`. Tests run on 6 worker processes (pytest-xdist), work-stealing since their durations
# span three orders of magnitude; `-n 0` runs them in this process, as pdb and the interactive viewers need.
addopts = -m "not interactive" -n 6 --dist worksteal

markers =
    interactive: opens a blocking window and needs a person at the keyboard
